name: Build and deploy NexEnergy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Frontend/part 2/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: Frontend/part 2
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://nexenergy-api.onrender.com' }}
      VITE_BASE_PATH: /code-cash/
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/part 2/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend lint
        run: npm run lint
      - name: Build frontend for GitHub Pages
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/part 2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
