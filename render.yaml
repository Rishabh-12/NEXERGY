services:
  - type: web
    name: campusiq-api
    runtime: node
    plan: free
    buildCommand: npm install --no-package-lock && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://rishabh-12.github.io
      - key: CAMERA_INGEST_TOKEN
        sync: false
