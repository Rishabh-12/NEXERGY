services:
  - type: web
    name: nexenergy-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install --upgrade pip && pip install -r requirements-server.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://rishabh-12.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
